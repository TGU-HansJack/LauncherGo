name: Publish Release

run-name: Publish ${{ inputs.version }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example: 1.2.3)"
        required: true
        default: "0.0.0"
        type: string
      channel:
        description: "Release type"
        required: true
        default: release
        type: choice
        options:
          - release
          - preview
      vintage_story_version:
        description: "Vintage Story server version used to build embedded ServerAuth mod"
        required: true
        default: "1.22.2"
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest

    env:
      PROJECT_PATH: LauncherGo.App/LauncherGo.App.csproj
      EMBEDDED_AUTH_PROJECT: LauncherGo.Services/EmbeddedMods/VsslAuthMod/VsslAuthMod.csproj
      CONFIGURATION: Release
      RUNTIME: win-x64
      VINTAGE_STORY_VERSION: 1.22.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare Vintage Story API refs
        shell: pwsh
        run: |
          $inputVsVersion = "${{ inputs.vintage_story_version }}"
          $vsVersion = if ([string]::IsNullOrWhiteSpace($inputVsVersion)) { $env:VINTAGE_STORY_VERSION } else { $inputVsVersion.Trim() }
          if ([string]::IsNullOrWhiteSpace($vsVersion)) { throw "VINTAGE_STORY_VERSION is empty." }

          $vsRoot = Join-Path $pwd ".vintagestory-runtime"
          $apiDll = Join-Path $vsRoot "VintagestoryAPI.dll"
          $libDll = Join-Path $vsRoot "VintagestoryLib.dll"
          $protobufDll = Join-Path $vsRoot "Lib/protobuf-net.dll"
          $survivalDll = Join-Path $vsRoot "Mods/VSSurvivalMod.dll"

          if (!(Test-Path $apiDll) -or !(Test-Path $libDll) -or !(Test-Path $protobufDll) -or !(Test-Path $survivalDll)) {
            New-Item -ItemType Directory -Force -Path $vsRoot | Out-Null
            $zipPath = Join-Path $vsRoot "vs_server_win-x64_$vsVersion.zip"
            $downloadUrl = "https://cdn.vintagestory.at/gamefiles/stable/vs_server_win-x64_$vsVersion.zip"

            Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $requiredEntries = @(
                "VintagestoryAPI.dll",
                "VintagestoryLib.dll",
                "Lib/protobuf-net.dll",
                "Mods/VSSurvivalMod.dll"
              )

              foreach ($entryName in $requiredEntries) {
                $entry = $zip.GetEntry($entryName)
                if ($null -eq $entry) {
                  throw "Missing required file '$entryName' in $downloadUrl"
                }

                $targetPath = Join-Path $vsRoot $entryName
                $targetDir = Split-Path -Parent $targetPath
                if (!(Test-Path $targetDir)) {
                  New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
                }

                $entryStream = $entry.Open()
                $fileStream = [System.IO.File]::Open($targetPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
                try {
                  $entryStream.CopyTo($fileStream)
                }
                finally {
                  $entryStream.Dispose()
                  $fileStream.Dispose()
                }
              }
            }
            finally {
              $zip.Dispose()
            }

            if (Test-Path $zipPath) {
              Remove-Item -LiteralPath $zipPath -Force
            }
          }

          "VINTAGE_STORY_VERSION=$vsVersion" >> $env:GITHUB_ENV
          "VINTAGE_STORY=$vsRoot" >> $env:GITHUB_ENV
          Write-Host "Using VINTAGE_STORY=$vsRoot"

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $rawVersion = "${{ inputs.version }}".Trim()
          if ($rawVersion.StartsWith("v")) { $rawVersion = $rawVersion.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            throw "Version input is empty."
          }

          $channel = "${{ inputs.channel }}".Trim().ToLowerInvariant()
          if ($channel -notin @("release", "preview")) {
            throw "Unsupported channel: $channel"
          }

          $version = $rawVersion
          if ($channel -eq "preview" -and $version -notmatch "-") {
            $version = "$version-preview"
          }

          $tag = "v$version"
          $title = "LauncherGo $version"
          if ($channel -eq "preview") {
            $title = "$title (Preview)"
          }

          $isPrerelease = if ($channel -eq "preview") { "true" } else { "false" }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore LauncherGo.slnx

      - name: Restore embedded ServerAuth mod project
        run: dotnet restore $env:EMBEDDED_AUTH_PROJECT

      - name: Build embedded ServerAuth mod
        shell: pwsh
        run: |
          dotnet build $env:EMBEDDED_AUTH_PROJECT -c $env:CONFIGURATION --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed: $env:EMBEDDED_AUTH_PROJECT"
          }

          $dllPath = "LauncherGo.Services/EmbeddedMods/VsslAuthMod/bin/$env:CONFIGURATION/net10.0/serverauth.dll"
          $targetDir = "LauncherGo.Services/EmbeddedMods/launchergoauth"
          $targetPath = Join-Path $targetDir "serverauth.dll"

          if (!(Test-Path $dllPath)) {
            throw "Missing built ServerAuth DLL: $dllPath"
          }

          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -LiteralPath $dllPath -Destination $targetPath -Force

      - name: Publish installer payload
        run: dotnet publish $env:PROJECT_PATH -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Version=${{ steps.meta.outputs.version }} -p:InformationalVersion=${{ steps.meta.outputs.version }} -o artifacts/publish/win-x64

      - name: Publish portable single-file
        run: dotnet publish $env:PROJECT_PATH -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Version=${{ steps.meta.outputs.version }} -p:InformationalVersion=${{ steps.meta.outputs.version }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish/portable

      - name: Publish self-contained small package
        run: dotnet publish $env:PROJECT_PATH -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true -p:Version=${{ steps.meta.outputs.version }} -p:InformationalVersion=${{ steps.meta.outputs.version }} -p:DebugType=None -p:DebugSymbols=false -p:StripPublishSymbols=true -o artifacts/publish/small-package

      - name: Copy embedded ServerAuth payload to publish outputs
        shell: pwsh
        run: |
          $sourceRoot = "LauncherGo.Services/EmbeddedMods/launchergoauth"
          $requiredFiles = @("serverauth.dll", "modinfo.json", "README.txt")

          foreach ($fileName in $requiredFiles) {
            $sourcePath = Join-Path $sourceRoot $fileName
            if (!(Test-Path $sourcePath)) {
              throw "Missing embedded ServerAuth source payload: $sourcePath"
            }
          }

          foreach ($publishRoot in @("artifacts/publish/win-x64", "artifacts/publish/portable", "artifacts/publish/small-package")) {
            $targetRoot = Join-Path $publishRoot "EmbeddedMods/launchergoauth"
            New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null

            foreach ($fileName in $requiredFiles) {
              Copy-Item -LiteralPath (Join-Path $sourceRoot $fileName) -Destination (Join-Path $targetRoot $fileName) -Force
            }
          }

      - name: Verify embedded ServerAuth payload exists
        shell: pwsh
        run: |
          $requiredPaths = @(
            "artifacts/publish/win-x64/LauncherGo.ServerHost.exe",
            "artifacts/publish/win-x64/EmbeddedMods/launchergoauth/serverauth.dll",
            "artifacts/publish/win-x64/EmbeddedMods/launchergoauth/modinfo.json",
            "artifacts/publish/win-x64/EmbeddedMods/launchergoauth/README.txt",
            "artifacts/publish/portable/EmbeddedMods/launchergoauth/serverauth.dll",
            "artifacts/publish/portable/EmbeddedMods/launchergoauth/modinfo.json",
            "artifacts/publish/portable/EmbeddedMods/launchergoauth/README.txt",
            "artifacts/publish/portable/LauncherGo.ServerHost.exe",
            "artifacts/publish/small-package/EmbeddedMods/launchergoauth/serverauth.dll",
            "artifacts/publish/small-package/EmbeddedMods/launchergoauth/modinfo.json",
            "artifacts/publish/small-package/EmbeddedMods/launchergoauth/README.txt",
            "artifacts/publish/small-package/LauncherGo.ServerHost.exe",
            "artifacts/publish/small-package/coreclr.dll",
            "artifacts/publish/small-package/hostfxr.dll",
            "artifacts/publish/small-package/hostpolicy.dll"
          )

          foreach ($path in $requiredPaths) {
            if (!(Test-Path $path)) {
              throw "Missing embedded ServerAuth payload: $path"
            }
          }

          $unexpectedSymbols = Get-ChildItem "artifacts/publish/small-package" -Recurse -Filter *.pdb -ErrorAction SilentlyContinue
          if ($unexpectedSymbols) {
            $unexpectedList = $unexpectedSymbols | ForEach-Object { $_.FullName }
            throw "Unexpected .pdb files found in small package publish output:`n$($unexpectedList -join "`n")"
          }

      - name: Prepare embedded ServerAuth artifact
        shell: pwsh
        run: |
          $modRoot = "artifacts/publish/win-x64/EmbeddedMods/launchergoauth"
          $outputRoot = "artifacts/embedded-mods"
          $zipPath = Join-Path $outputRoot "launchergoauth.zip"

          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null

          foreach ($fileName in @("serverauth.dll", "modinfo.json", "README.txt")) {
            $requiredPath = Join-Path $modRoot $fileName
            if (!(Test-Path $requiredPath)) {
              throw "Missing embedded ServerAuth package file: $requiredPath"
            }
          }

          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $modRoot "*") -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Prepare portable artifact
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $staging = "artifacts/portable/LauncherGo-portable-$version-win-x64"
          $zipPath = "artifacts/portable/LauncherGo-portable-$version-win-x64.zip"
          $publishRoot = "artifacts/publish/portable"

          if (Test-Path $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $publishRoot "*") -Destination $staging -Recurse -Force

          if (!(Test-Path (Join-Path $staging "LauncherGo.App.exe"))) {
            throw "Missing portable executable."
          }

          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Prepare small package artifact
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $staging = "artifacts/small-package/LauncherGo-small-package-$version-win-x64"
          $zipPath = "artifacts/small-package/LauncherGo-small-package-$version-win-x64.zip"
          $publishRoot = "artifacts/publish/small-package"

          if (Test-Path $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $publishRoot "*") -Destination $staging -Recurse -Force

          if (!(Test-Path (Join-Path $staging "LauncherGo.App.exe"))) {
            throw "Missing small package executable."
          }

          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"

          New-Item -ItemType Directory -Force -Path artifacts/installer | Out-Null

          $buildDir = (Resolve-Path "artifacts/publish/win-x64").Path
          $outputDir = (Resolve-Path "artifacts/installer").Path

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DBuildDir=$buildDir" `
            "/DOutputDir=$outputDir" `
            "installer/LauncherGo.iss"

      - name: Build small installer package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $buildDir = (Resolve-Path "artifacts/publish/small-package").Path
          $outputDir = (Resolve-Path "artifacts/installer").Path
          $outputBaseName = "LauncherGo-Small-Setup-$version-win-x64"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DBuildDir=$buildDir" `
            "/DOutputDir=$outputDir" `
            "/DOutputBaseFilename=$outputBaseName" `
            "installer/LauncherGo.iss"

          if (!(Test-Path (Join-Path $outputDir "$outputBaseName.exe"))) {
            throw "Missing small installer output."
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/installer/*.exe
            artifacts/portable/LauncherGo-portable-${{ steps.meta.outputs.version }}-win-x64.zip
            artifacts/small-package/LauncherGo-small-package-${{ steps.meta.outputs.version }}-win-x64.zip
            artifacts/embedded-mods/*.zip
