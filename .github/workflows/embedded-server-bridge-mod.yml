name: Build Embedded Server Bridge Mod

on:
  workflow_dispatch:
    inputs:
      vintage_story_version:
        description: "Vintage Story server version used for API references"
        required: true
        default: "1.22.2"
        type: string

jobs:
  build-launchergoserverbridge:
    runs-on: windows-latest

    env:
      CONFIGURATION: Release
      VINTAGE_STORY_VERSION: ${{ inputs.vintage_story_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare Vintage Story API refs
        shell: pwsh
        run: |
          $vsVersion = $env:VINTAGE_STORY_VERSION.Trim()
          if ([string]::IsNullOrWhiteSpace($vsVersion)) { throw "VINTAGE_STORY_VERSION is empty." }

          $vsRoot = Join-Path $pwd ".vintagestory-runtime"
          $requiredEntries = @("VintagestoryAPI.dll", "VintagestoryLib.dll", "Lib/protobuf-net.dll")
          $missingReference = $requiredEntries | Where-Object { !(Test-Path (Join-Path $vsRoot $_)) } | Select-Object -First 1
          if ($null -ne $missingReference) {
            New-Item -ItemType Directory -Force -Path $vsRoot | Out-Null
            $zipPath = Join-Path $vsRoot "vs_server_win-x64_$vsVersion.zip"
            $downloadUrl = "https://cdn.vintagestory.at/gamefiles/stable/vs_server_win-x64_$vsVersion.zip"

            Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              foreach ($entryName in $requiredEntries) {
                $entry = $zip.GetEntry($entryName)
                if ($null -eq $entry) { throw "Missing required file '$entryName' in $downloadUrl" }

                $targetPath = Join-Path $vsRoot $entryName
                $targetDir = Split-Path -Parent $targetPath
                if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Force -Path $targetDir | Out-Null }

                $entryStream = $entry.Open()
                $fileStream = [System.IO.File]::Open($targetPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
                try { $entryStream.CopyTo($fileStream) }
                finally {
                  $entryStream.Dispose()
                  $fileStream.Dispose()
                }
              }
            }
            finally {
              $zip.Dispose()
            }

            Remove-Item -LiteralPath $zipPath -Force
          }

          "VINTAGE_STORY=$vsRoot" >> $env:GITHUB_ENV

      - name: Restore server bridge mod
        run: dotnet restore LauncherGo.Services/EmbeddedMods/LauncherGoServerBridgeMod/LauncherGoServerBridgeMod.csproj

      - name: Build server bridge mod
        run: dotnet build LauncherGo.Services/EmbeddedMods/LauncherGoServerBridgeMod/LauncherGoServerBridgeMod.csproj -c $env:CONFIGURATION --no-restore

      - name: Package server bridge mod
        shell: pwsh
        run: |
          $projectDir = "LauncherGo.Services/EmbeddedMods/LauncherGoServerBridgeMod"
          $metadataDir = "LauncherGo.Services/EmbeddedMods/launchergoserverbridge"
          $outputDir = "artifacts/embedded-mods/launchergoserverbridge"
          $zipPath = "artifacts/embedded-mods/launchergoserverbridge.zip"
          $dllPath = Join-Path $projectDir "bin/$env:CONFIGURATION/net10.0/serverbridge.dll"

          if (!(Test-Path $dllPath)) { throw "Missing built DLL: $dllPath" }
          foreach ($file in @("modinfo.json", "README.txt")) {
            $path = Join-Path $metadataDir $file
            if (!(Test-Path $path)) { throw "Missing server bridge metadata: $path" }
          }
          if (!(Test-Path "LICENSE")) { throw "Missing repository LICENSE file." }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Copy-Item -LiteralPath $dllPath -Destination (Join-Path $outputDir "serverbridge.dll") -Force
          Copy-Item -LiteralPath (Join-Path $metadataDir "modinfo.json") -Destination $outputDir -Force
          Copy-Item -LiteralPath (Join-Path $metadataDir "README.txt") -Destination $outputDir -Force
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $outputDir "LICENSE.txt") -Force
          Compress-Archive -Path (Join-Path $outputDir "*") -DestinationPath $zipPath -Force

      - name: Upload server bridge mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: LauncherGo-launchergoserverbridge
          path: artifacts/embedded-mods/launchergoserverbridge.zip
          if-no-files-found: error
